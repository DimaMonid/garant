<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск оборудования по адресу</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --border:#dfe3e8; --text:#1f2933;
    --muted:#6b7280; --accent:#2563eb; --accent-soft:#e8f0fe;
    --loc-bg:#f1f5f9; --loc-border:#cbd5e1;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.45}
  header{background:#0f172a;color:#fff;padding:20px 24px}
  header h1{margin:0;font-size:20px;font-weight:600}
  header p{margin:4px 0 0;font-size:13px;color:#cbd5e1}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
  .searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .searchbar input{flex:1;min-width:240px;padding:12px 14px;font-size:16px;
       border:1px solid var(--border);border-radius:10px;background:#fff;outline:none}
  .searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .searchbar input:disabled{background:#eef1f5;color:#9aa3ad}
  .searchbar button{padding:12px 20px;font-size:15px;border:0;border-radius:10px;
       background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
  .searchbar button:disabled{background:#9db8f0;cursor:not-allowed}
  .searchbar button:hover:not(:disabled){background:#1d4ed8}
  .hint{font-size:13px;color:var(--muted);margin-bottom:14px}
  .status{font-size:14px;color:var(--muted);margin:10px 0 16px}
  .status b{color:var(--text)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
        padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h3{margin:0 0 2px;font-size:17px;color:var(--accent)}
  .card .sheet{font-size:12px;color:var(--muted);margin-bottom:12px}
  .loc-block{background:var(--loc-bg);border:1px solid var(--loc-border);
       border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .loc-block:last-child{margin-bottom:0}
  .loc-block .loc-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:8px;
       display:flex;align-items:center;gap:6px}
  .loc-block .loc-title::before{content:"📍";font-size:13px}
  .equip-row{display:grid;grid-template-columns:1fr auto;gap:8px 14px;
       padding:6px 0;border-top:1px dashed #d7dde5;font-size:14px}
  .equip-row:first-of-type{border-top:0}
  .equip-row .eq-name{font-weight:600;color:#1f2933;word-break:break-word}
  .comm-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;
       background:#e0e7ff;color:#3730a3;font-weight:600;white-space:nowrap;align-self:start}
  .extra{margin-top:8px;font-size:13px;color:#374151}
  .extra .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;
       color:var(--muted);margin-bottom:1px}
  .no-results{padding:24px;text-align:center;color:var(--muted);background:#fff;
       border:1px dashed var(--border);border-radius:12px}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;
       padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
  .loading{background:#eef4ff;border:1px solid #c7d7fe;color:#1e40af;
       padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
  @media (max-width:600px){.wrap{padding:14px}}
</style>
</head>
<body>
<header>
  <h1>Поиск оборудования по адресу</h1>
  <p>Данные читаются из Excel-файла (все листы) рядом с этой страницей</p>
</header>

<div class="wrap">
  <div id="loading" class="loading">Загрузка файла Excel…</div>
  <div id="error" class="err" style="display:none"></div>

  <div class="searchbar">
    <input id="q" type="search" placeholder="Введите адрес, например: Гагарина 18, Поповича 7…" disabled autocomplete="off">
    <button id="btn" disabled>Найти</button>
  </div>
  <div class="hint">
    Поиск нечувствителен к регистру, букве «ё», точкам/запятым. Можно вводить часть адреса —
    только улицу или только номер дома.
  </div>
  <div id="status" class="status"></div>
  <div id="results"></div>
</div>

<script>
/* ============================================================
   Имя Excel-файла в корне репозитория (рядом с index.html).
   ============================================================ */
const EXCEL_FILE = 'data.xlsx';

let RECORDS = [];
const $q       = document.getElementById('q');
const $btn     = document.getElementById('btn');
const $status  = document.getElementById('status');
const $results = document.getElementById('results');
const $error   = document.getElementById('error');
const $loading = document.getElementById('loading');

/* ---------- Загрузка при старте ---------- */
(async function init(){
  try {
    const res = await fetch(EXCEL_FILE, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — файл «' + EXCEL_FILE + '» не найден.');
    const buf = await res.arrayBuffer();
    const wb  = XLSX.read(buf, { type: 'array', cellDates: true });

    RECORDS = buildRecords(wb);
    if (RECORDS.length === 0) throw new Error('В файле не найдено ни одной записи с адресом.');

    $loading.style.display = 'none';
    $q.disabled = false;
    $btn.disabled = false;
    $q.focus();
    $status.innerHTML = 'Загружено записей: <b>' + RECORDS.length + '</b> из ' +
                        wb.SheetNames.length + ' листов';
  } catch (err) {
    console.error(err);
    $loading.style.display = 'none';
    $error.textContent = 'Не удалось загрузить данные: ' + (err.message || err);
    $error.style.display = 'block';
  }
})();

/* ============================================================
   РАЗБОР ЛИСТА
   ============================================================ */
function sheetToRows(ws){
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
}

function detectColumns(rows){
  const KEYS = {
    addr:   ['улица', 'адрес'],
    loc:    ['раположение', 'расположение'],
    equip:  ['оборудование', 'оборуд'],
    eth:    ['ethernet', 'ящики'],
    access: ['доступ'],
  };

  let best = { idx: -1, score: 0, header: [] };
  for (let i = 0; i < Math.min(10, rows.length); i++){
    const header = rows[i].map(v => String(v).toLowerCase().trim());
    let score = 0;
    for (const k of Object.keys(KEYS)){
      if (header.some(h => KEYS[k].some(kw => h.includes(kw)))) score++;
    }
    if (header.some(h => h.includes('улица') || h.includes('адрес'))) score += 2;
    if (score > best.score) best = { idx: i, score, header };
  }
  if (best.idx === -1){
    best.idx = 0;
    best.header = (rows[0] || []).map(v => String(v).toLowerCase().trim());
  }

  const header = best.header;
  const find = (kwList) => header.findIndex(h => kwList.some(kw => h.includes(kw)));

  const locIdxes = [];
  header.forEach((h, i) => {
    if (h.includes('раположение') || h.includes('расположение')) locIdxes.push(i);
  });

  const colEquip = find(KEYS.equip);

  // № коммутатора — столбец СРАЗУ ПОСЛЕ «Оборудование»
  let colComm = -1;
  if (colEquip >= 0 && colEquip + 1 < header.length){
    colComm = colEquip + 1;
  } else {
    colComm = find(['коммутатор', '№ ком', 'инв']);
  }

  return {
    headerIdx: best.idx,
    colAddr:   find(KEYS.addr),
    colLoc1:   locIdxes[0] ?? -1,
    colLoc2:   locIdxes[1] ?? -1,
    colEquip,
    colComm,
    colEth:    find(KEYS.eth),
    colAccess: find(KEYS.access),
  };
}

/* ============================================================
   ИЗВЛЕЧЕНИЕ С НАСЛЕДОВАНИЕМ РАСПОЛОЖЕНИЯ
   ------------------------------------------------------------
   Идём по строкам сверху вниз и держим «состояние»:
     currentAddr  — последний встреченный адрес
     currentLoc   — последнее встреченное расположение
   Правила:
     • адрес непустой → новая карточка дома, сброс currentLoc.
     • адрес пустой, расположение непустое → обновляем currentLoc.
     • адрес пустой, расположение пустое, но есть оборудование/№ →
       оборудование относится к currentLoc (наследование).
   ============================================================ */
function extractSheet(name, ws){
  const rows = sheetToRows(ws);
  if (rows.length === 0) return [];

  const c = detectColumns(rows);
  if (c.colAddr < 0) return [];

  const out = [];
  let current = null;   // текущая карточка дома
  let currentLoc = '';  // последнее непустое расположение

  const get = (row, idx) => (idx >= 0 && idx < row.length) ? String(row[idx] ?? '').trim() : '';

  for (let i = c.headerIdx + 1; i < rows.length; i++){
    const row = rows[i];

    const addr  = get(row, c.colAddr);
    const loc1  = get(row, c.colLoc1);
    const loc2  = get(row, c.colLoc2);
    const equip = get(row, c.colEquip);
    const comm  = get(row, c.colComm);
    const eth   = get(row, c.colEth);
    const access= get(row, c.colAccess);

    // Собираем расположение из двух возможных столбцов
    let loc = '';
    if (loc1 && loc2) loc = loc1 + ' · ' + loc2;
    else loc = loc1 || loc2;

    // 1) Новый дом
    if (addr){
      current = {
        addr,
        sheet: name,
        blocks: [],       // [{ loc, items:[{equip,comm}] }]
        ethParts: [],
        accessParts: [],
      };
      out.push(current);
      currentLoc = '';    // сбрасываем наследование для нового дома
    }

    if (!current) continue;   // строки до первого адреса пропускаем

    // 2) Обновляем текущее расположение, если оно указано
    if (loc) currentLoc = loc;

    // 3) Определяем, к какому расположению отнести оборудование
    const targetLoc = loc || currentLoc;

    // 4) Если в строке есть оборудование или № коммутатора — добавляем в блок
    if (equip || comm){
      addEquip(current, targetLoc || 'Расположение не указано', equip, comm);
    } else if (targetLoc){
      // Строка без оборудования, но с расположением — создаём пустой блок-заголовок,
      // чтобы было видно, что такое место существует (без оборудования).
      // Но если блок уже есть — не дублируем.
      ensureBlock(current, targetLoc);
    }

    if (eth)    pushUnique(current.ethParts, eth);
    if (access) pushUnique(current.accessParts, access);
  }

  // Пост-обработка: убираем пустые блоки (без оборудования),
  // кроме случаев, когда во всём доме нет ни одного оборудования —
  // тогда оставляем хотя бы расположения.
  return out.map(r => {
    const blocks = r.blocks
      .map(b => ({
        loc: b.loc,
        items: b.items.filter(it => it.equip || it.comm),
      }))
      .filter(b => b.items.length > 0 || b.isPlaceholder);

    return {
      addr:   r.addr,
      sheet:  r.sheet,
      blocks: blocks.length ? blocks : r.blocks,
      eth:    r.ethParts.join('; '),
      access: r.accessParts.join('; '),
    };
  });
}

/* Найти или создать блок по расположению */
function ensureBlock(rec, loc){
  let b = rec.blocks.find(x => x.loc === loc);
  if (!b){
    b = { loc, items: [] };
    rec.blocks.push(b);
  }
  return b;
}

/* Добавить оборудование в блок расположения */
function addEquip(rec, loc, equip, comm){
  const b = ensureBlock(rec, loc);
  // если такая же пара уже есть — не дублируем
  const dup = b.items.some(it => it.equip === equip && it.comm === comm);
  if (!dup) b.items.push({ equip, comm });
}

function pushUnique(arr, v){
  v = String(v ?? '').trim();
  if (!v) return;
  if (!arr.includes(v)) arr.push(v);
}

/* ============================================================
   СБОРКА ПО ВСЕМ ЛИСТАМ
   ============================================================ */
function buildRecords(wb){
  const records = [];
  for (const name of wb.SheetNames){
    const ws = wb.Sheets[name];
    if (!ws) continue;
    try {
      records.push(...extractSheet(name, ws));
    } catch (e){
      console.warn('Лист не обработан:', name, e);
    }
  }
  return records;
}

/* ============================================================
   ПОИСК
   ============================================================ */
function norm(s){
  return String(s || '')
    .toLowerCase()
    .replace(/ё/g,'е')
    .replace(/\s+/g,' ')
    .replace(/[.,]/g,' ')
    .replace(/\bд\b/g,'')
    .replace(/\bкорп\b/g,'')
    .replace(/\s+/g,' ')
    .trim();
}

function search(query){
  const nq = norm(query);
  if(!nq) return [];
  const tokens = nq.split(' ').filter(Boolean);
  return RECORDS.filter(rec => {
    const na = norm(rec.addr);
    return tokens.every(t => na.includes(t));
  }).sort((a,b) => {
    const na = norm(a.addr), nb = norm(b.addr);
    const exactA = na === nq ? 0 : 1;
    const exactB = nb === nq ? 0 : 1;
    if(exactA !== exactB) return exactA - exactB;
    return a.addr.localeCompare(b.addr, 'ru');
  });
}

/* ============================================================
   ОТРИСОВКА
   ============================================================ */
function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderBlock(block){
  const items = block.items.map(it => {
    const name = it.equip ? esc(it.equip) : '<span style="color:#9aa3ad">—</span>';
    const commBadge = it.comm
      ? '<span class="comm-badge" title="№ коммутатора">№ ' + esc(it.comm) + '</span>'
      : '';
    return '<div class="equip-row">' +
             '<div class="eq-name">' + name + '</div>' +
             '<div>' + commBadge + '</div>' +
           '</div>';
  }).join('');

  return '<div class="loc-block">' +
           '<div class="loc-title">' + esc(block.loc) + '</div>' +
           (items || '<div class="equip-row" style="color:#9aa3ad">Оборудование не указано</div>') +
         '</div>';
}

function render(list, query){
  if(!query.trim()){ $status.textContent=''; $results.innerHTML=''; return; }
  if(list.length === 0){
    $status.innerHTML = 'По запросу <b>' + esc(query) + '</b> ничего не найдено.';
    $results.innerHTML = '<div class="no-results">Попробуйте ввести часть адреса: только улицу или только номер дома.</div>';
    return;
  }
  $status.innerHTML = 'Найдено записей: <b>' + list.length + '</b> по запросу «' + esc(query) + '»';

  $results.innerHTML = list.map(rec => {
    const blocksHtml = rec.blocks.length
      ? rec.blocks.map(renderBlock).join('')
      : '<div class="loc-block" style="color:#9aa3ad">Расположение не указано</div>';

    const extra = [];
    if (rec.eth){
      extra.push('<div class="extra"><div class="lbl">Ящики Ethernet</div>' + esc(rec.eth) + '</div>');
    }
    if (rec.access){
      extra.push('<div class="extra"><div class="lbl">Доступ к оборудованию</div>' + esc(rec.access) + '</div>');
    }

    return '<div class="card">' +
      '<h3>' + esc(rec.addr) + '</h3>' +
      '<div class="sheet">Лист: ' + esc(rec.sheet) + '</div>' +
      blocksHtml +
      extra.join('') +
    '</div>';
  }).join('');
}

function doSearch(){
  if(!RECORDS.length) return;
  const q = $q.value;
  render(search(q), q);
}

$btn.addEventListener('click', doSearch);
$q.addEventListener('input', doSearch);
$q.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
